name: Organize uploads
on:
  push:
    branches: [main]
    paths: ['inbox/**', '*.zip', '*(*)*', 'pages.yml', 'train.yml', 'engine.js', 'worker.js', 'train.js', 'index.html']
  workflow_dispatch:
permissions: {contents: write, actions: write}
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORGANIZE_TOKEN || github.token }}
      - env: {HAS_PAT: '${{ secrets.ORGANIZE_TOKEN != '''' }}'}
        run: python3 scripts/organize.py
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name chess-ai; git config user.email bot@users.noreply.github.com
          git add -A; git commit -m "Organize uploads" || exit 0
          git push && gh workflow run pages.yml
