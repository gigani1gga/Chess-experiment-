name: Train AI
on:
  schedule: [{cron: '0 */6 * * *'}]
  workflow_dispatch:
    inputs:
      seconds: {description: 'Training seconds', default: '600'}
      options: {description: 'Extra options, e.g. workers=2 nz=20 league=0 gate=0.45', default: ''}
permissions: {contents: write, actions: write}
concurrency: {group: repo-writes, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Self-play training
        env:
          SECS: ${{ inputs.seconds || 600 }}
          OPTS: ${{ inputs.options }}
        run: node train.js "$SECS" $OPTS
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name chess-ai; git config user.email bot@users.noreply.github.com
          git add brain; git commit -m "brain update" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && gh workflow run pages.yml && exit 0
            sleep 5
          done
          exit 1
